# Re-runs the model from fresh public data every day and commits the dated snapshot,
# so the evidence behind every version of the thesis is kept in the repository.
name: Daily snapshot
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lib/**", "scripts/**", "public/js/model.js"]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run model
      - name: Commit the snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "Data snapshot $(date -u +%F)"
          git push
